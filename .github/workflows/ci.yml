name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]

jobs:
  automation-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install template test dependencies
        run: python -m pip install "Jinja2>=3.1,<4" "PyYAML>=6,<7"
      - name: Backend template and ownership tests
        run: python -m unittest discover -s blueprints/tests
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Mobile browser tests
        run: npm run test:browser
      - name: Check committed bundle is current
        run: |
          test -f comfoair-card.js
          git diff --exit-code -- comfoair-card.js
