# Configure actual entities and values before enabling this optional package.
input_number:
  ventilation_balance_baseline:
    name: Ventilation airflow baseline
    min: -100
    max: 100
    step: 1
  ventilation_balance_tolerance:
    name: Ventilation airflow tolerance
    min: 0
    max: 100
    step: 1
  ventilation_airflow_max_age:
    name: Ventilation airflow maximum report age
    min: 60
    max: 86400
    step: 60
input_boolean:
  ventilation_airflow_monitor_enabled:
    name: Ventilation airflow monitor enabled
    initial: false
  ventilation_airflow_grace:
    name: Ventilation airflow grace period
template:
- binary_sensor:
  - name: Ventilation sustained airflow deviation
    unique_id: ventilation_sustained_airflow_deviation
    delay_on: 00:10:00
    availability: "{{ is_number(states('sensor.ventilation_supply_flow')) and is_number(states('sensor.ventilation_extract_flow'))\n\
      \   and state_attr('sensor.ventilation_supply_flow','unit_of_measurement') in ['m\xB3/h','m3/h','L/s','l/s']\n\
      \   and state_attr('sensor.ventilation_extract_flow','unit_of_measurement') in ['m\xB3/h','m3/h','L/s','l/s']\n\
      \   and is_number(states('input_number.ventilation_balance_baseline'))\n   and is_number(states('input_number.ventilation_balance_tolerance'))\
      \ and is_number(states('input_number.ventilation_airflow_max_age')) }}"
    state: "{% set s = states('sensor.ventilation_supply_flow') | float(0) * (3.6 if state_attr('sensor.ventilation_supply_flow','unit_of_measurement')\
      \ in ['L/s','l/s'] else 1) %} {% set e = states('sensor.ventilation_extract_flow') | float(0) * (3.6 if state_attr('sensor.ventilation_extract_flow','unit_of_measurement')\
      \ in ['L/s','l/s'] else 1) %} {{ is_state('input_boolean.ventilation_airflow_monitor_enabled','on')\n   and\
      \ is_state('input_boolean.ventilation_airflow_grace','off')\n   and is_state('input_boolean.ventilation_boost_active','off')\n\
      \   and is_state('binary_sensor.ventilation_bypass_open','off')\n   and s >= 1 and e >= 1\n and as_timestamp(now())-as_timestamp(states['sensor.ventilation_supply_flow'].last_reported,0)\
      \ <= states('input_number.ventilation_airflow_max_age') | float(900)\n and as_timestamp(now())-as_timestamp(states['sensor.ventilation_extract_flow'].last_reported,0)\
      \ <= states('input_number.ventilation_airflow_max_age') | float(900)\n   and ((100 * (s-e) / e - states('input_number.ventilation_balance_baseline')\
      \ | float(0)) | abs\n        > states('input_number.ventilation_balance_tolerance') | float(10)) }}"
